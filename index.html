<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Playbook Concierge — Ecom Club</title>
  <meta name="description" content="Base de conhecimento interna do time Concierge da Ecom Club. Tudo sobre Nuvemshop, tráfego pago, mineração e processos do time." />

  <!-- Fontes -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />

  <style>
    /* ============== TOKENS ============== */
    :root {
      --bg:           #0A0A0A;
      --bg-elev:      #141414;
      --bg-elev-2:    #1C1C1C;
      --bg-card:      #161616;
      --bg-warm:      #1F1A12;
      --gold:         #F59E0B;
      --gold-soft:    #FBBF24;
      --gold-dim:     #78350F;
      --gold-faint:   rgba(245, 158, 11, 0.12);
      --border:       #262626;
      --border-soft:  #1F1F1F;
      --text:         #FFFFFF;
      --text-muted:   #A1A1A1;
      --text-faint:   #6B6B6B;
      --red:          #EF4444;
      --green:        #22C55E;
      --shadow:       0 4px 24px rgba(0,0,0,0.4);

      --sidebar-w:    280px;
      --header-h:     64px;
      --radius:       10px;
      --radius-lg:    14px;
    }

    /* ============== RESET ============== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
      font-size: 15px;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    a { color: var(--gold); text-decoration: none; }
    a:hover { color: var(--gold-soft); text-decoration: underline; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
    code {
      font-family: 'JetBrains Mono', monospace;
      background: var(--bg-elev-2);
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 0.88em;
      color: var(--gold-soft);
      border: 1px solid var(--border);
    }

    /* ============== HEADER ============== */
    .header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--header-h);
      background: rgba(10, 10, 10, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      z-index: 50;
      display: flex;
      align-items: center;
      padding: 0 24px;
      gap: 20px;
    }
    .header__brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: 'Bricolage Grotesque', sans-serif;
      font-weight: 800;
      font-size: 17px;
      letter-spacing: -0.01em;
      cursor: pointer;
      flex-shrink: 0;
    }
    .header__brand:hover { text-decoration: none; }
    .brand__mark {
      width: 32px; height: 32px;
      border-radius: 50%;
      border: 2px solid var(--gold);
      position: relative;
      flex-shrink: 0;
    }
    .brand__mark::before {
      content: "";
      position: absolute;
      inset: 4px;
      border-top: 2px solid var(--gold);
      border-radius: 50%;
      transform: rotate(-45deg);
    }
    .brand__sub {
      color: var(--text-muted);
      font-weight: 500;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-left: 6px;
      padding-left: 12px;
      border-left: 1px solid var(--border);
    }

    .header__search {
      flex: 1;
      max-width: 600px;
      position: relative;
    }
    .header__search input {
      width: 100%;
      height: 38px;
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0 36px 0 38px;
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      transition: all 0.15s;
    }
    .header__search input:focus {
      outline: none;
      border-color: var(--gold);
      background: var(--bg-elev-2);
    }
    .header__search input::placeholder { color: var(--text-faint); }
    .search__icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      color: var(--text-faint);
      pointer-events: none;
    }
    .search__shortcut {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: var(--bg-elev-2);
      border: 1px solid var(--border);
      color: var(--text-faint);
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .header__stat {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      background: var(--gold-faint);
      border: 1px solid var(--gold-dim);
      border-radius: 999px;
      font-size: 12px;
      color: var(--gold-soft);
      font-weight: 500;
      flex-shrink: 0;
    }
    .header__stat .dot {
      width: 6px; height: 6px;
      background: var(--gold);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--gold);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* ============== LAYOUT ============== */
    .app {
      display: grid;
      grid-template-columns: var(--sidebar-w) 1fr;
      padding-top: var(--header-h);
      min-height: 100vh;
    }

    /* ============== SIDEBAR ============== */
    .sidebar {
      position: sticky;
      top: var(--header-h);
      height: calc(100vh - var(--header-h));
      overflow-y: auto;
      border-right: 1px solid var(--border);
      padding: 24px 16px;
      background: var(--bg);
    }
    .sidebar::-webkit-scrollbar { width: 6px; }
    .sidebar::-webkit-scrollbar-track { background: transparent; }
    .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .sidebar__section { margin-bottom: 28px; }
    .sidebar__label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-faint);
      padding: 0 12px 8px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 8px;
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 500;
      transition: all 0.12s;
      cursor: pointer;
      border-left: 2px solid transparent;
      margin-bottom: 2px;
    }
    .nav-item:hover {
      background: var(--bg-elev);
      color: var(--text);
      text-decoration: none;
    }
    .nav-item.active {
      background: var(--gold-faint);
      color: var(--gold);
      border-left-color: var(--gold);
    }
    .nav-item__icon {
      font-size: 16px;
      width: 20px;
      text-align: center;
    }
    .nav-item__count {
      margin-left: auto;
      font-size: 11px;
      background: var(--bg-elev-2);
      color: var(--text-faint);
      padding: 1px 7px;
      border-radius: 999px;
      border: 1px solid var(--border);
    }
    .nav-item.active .nav-item__count {
      background: var(--gold-dim);
      color: var(--gold-soft);
      border-color: var(--gold-dim);
    }

    /* ============== MAIN ============== */
    .main {
      padding: 40px 48px 80px;
      max-width: 1100px;
      width: 100%;
    }

    /* ---------- HOME ---------- */
    .home-hero {
      margin-bottom: 48px;
      padding: 40px 0 32px;
      border-bottom: 1px solid var(--border);
    }
    .home-hero__eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--gold);
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }
    .home-hero__eyebrow::before {
      content: "";
      width: 24px;
      height: 1px;
      background: var(--gold);
    }
    .home-hero__title {
      font-family: 'Bricolage Grotesque', sans-serif;
      font-size: 52px;
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -0.025em;
      margin-bottom: 16px;
    }
    .home-hero__title em {
      font-style: normal;
      color: var(--gold);
    }
    .home-hero__lead {
      font-size: 17px;
      color: var(--text-muted);
      max-width: 680px;
      line-height: 1.65;
    }

    .home-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-bottom: 56px;
    }
    .area-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
      overflow: hidden;
    }
    .area-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--gold-faint) 0%, transparent 60%);
      opacity: 0;
      transition: opacity 0.2s;
    }
    .area-card:hover {
      border-color: var(--gold-dim);
      transform: translateY(-2px);
    }
    .area-card:hover::before { opacity: 1; }
    .area-card > * { position: relative; z-index: 1; }
    .area-card__header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 12px;
    }
    .area-card__icon {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: var(--gold-faint);
      border: 1px solid var(--gold-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      color: var(--gold);
    }
    .area-card__title {
      font-family: 'Bricolage Grotesque', sans-serif;
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .area-card__desc {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 16px;
    }
    .area-card__meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: var(--text-faint);
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }
    .area-card__meta strong {
      color: var(--gold);
      font-weight: 600;
    }

    /* ---------- AREA LISTING ---------- */
    .area-header {
      margin-bottom: 32px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }
    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-faint);
      margin-bottom: 16px;
    }
    .breadcrumb a { color: var(--text-faint); font-weight: 500; }
    .breadcrumb a:hover { color: var(--gold); text-decoration: none; }
    .breadcrumb__sep { opacity: 0.5; }

    .area-header__title {
      font-family: 'Bricolage Grotesque', sans-serif;
      font-size: 38px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .area-header__icon {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      background: var(--gold-faint);
      border: 1px solid var(--gold-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }
    .area-header__desc {
      color: var(--text-muted);
      font-size: 16px;
    }

    .article-list {
      display: grid;
      gap: 12px;
    }
    .article-row {
      display: block;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 22px;
      cursor: pointer;
      transition: all 0.15s;
      text-decoration: none;
      color: inherit;
    }
    .article-row:hover {
      border-color: var(--gold-dim);
      background: var(--bg-elev);
      text-decoration: none;
      transform: translateX(2px);
    }
    .article-row__title {
      font-family: 'Bricolage Grotesque', sans-serif;
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 5px;
      letter-spacing: -0.01em;
    }
    .article-row__summary {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 10px;
    }
    .article-row__tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .tag {
      font-size: 11px;
      padding: 2px 8px;
      background: var(--bg-elev-2);
      border: 1px solid var(--border);
      color: var(--text-faint);
      border-radius: 4px;
      font-family: 'JetBrains Mono', monospace;
    }

    /* ---------- ARTICLE ---------- */
    .article {
      max-width: 760px;
    }
    .article__header {
      margin-bottom: 32px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }
    .article__title {
      font-family: 'Bricolage Grotesque', sans-serif;
      font-size: 36px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 16px;
    }
    .article__summary {
      font-size: 17px;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 20px;
    }
    .article__tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .article__body {
      font-size: 15.5px;
      line-height: 1.75;
      color: #E5E5E5;
    }
    .article__body p { margin-bottom: 16px; }
    .article__body h3 {
      font-family: 'Bricolage Grotesque', sans-serif;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.015em;
      margin-top: 36px;
      margin-bottom: 14px;
      color: var(--text);
    }
    .article__body h4 {
      font-family: 'Bricolage Grotesque', sans-serif;
      font-size: 17px;
      font-weight: 600;
      margin-top: 24px;
      margin-bottom: 10px;
      color: var(--gold-soft);
    }
    .article__body ul, .article__body ol {
      margin: 0 0 18px 24px;
      padding-left: 8px;
    }
    .article__body li {
      margin-bottom: 8px;
      padding-left: 4px;
    }
    .article__body li::marker { color: var(--gold); }
    .article__body strong, .article__body b { color: var(--text); font-weight: 600; }
    .article__body table {
      width: 100%;
      border-collapse: collapse;
      margin: 20px 0;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .article__body th {
      background: var(--bg-elev-2);
      color: var(--gold);
      font-weight: 600;
      text-align: left;
      padding: 12px 14px;
      font-size: 13px;
      border-bottom: 1px solid var(--border);
    }
    .article__body td {
      padding: 11px 14px;
      border-bottom: 1px solid var(--border-soft);
      font-size: 14px;
    }
    .article__body tr:last-child td { border-bottom: none; }

    .callout {
      background: var(--gold-faint);
      border: 1px solid var(--gold-dim);
      border-left: 3px solid var(--gold);
      border-radius: var(--radius);
      padding: 14px 18px;
      margin: 20px 0;
      font-size: 14.5px;
      color: var(--text);
    }
    .callout.warning {
      background: rgba(239, 68, 68, 0.08);
      border-color: rgba(239, 68, 68, 0.4);
      border-left-color: var(--red);
    }
    .callout strong { color: var(--gold); }
    .callout.warning strong { color: var(--red); }

    .example {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-left: 3px solid var(--gold-soft);
      border-radius: var(--radius);
      padding: 16px 20px;
      margin: 16px 0;
      font-size: 14.5px;
    }
    .example p { margin-bottom: 8px; }
    .example p:last-child { margin-bottom: 0; }

    /* ---------- BACK / ACTIONS ---------- */
    .article__actions {
      margin-top: 48px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .copy-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 500;
      transition: all 0.15s;
    }
    .copy-link:hover {
      border-color: var(--gold);
      color: var(--gold);
      background: var(--gold-faint);
    }
    .copy-link.copied { color: var(--green); border-color: var(--green); }

    /* ---------- SEARCH RESULTS ---------- */
    .search-results {
      max-width: 760px;
    }
    .search-results__header {
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    .search-results__title {
      font-family: 'Bricolage Grotesque', sans-serif;
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .search-results__count { color: var(--text-muted); font-size: 14px; }
    .search-results__count em { color: var(--gold); font-style: normal; font-weight: 600; }
    .search-results__empty {
      text-align: center;
      padding: 64px 24px;
      color: var(--text-muted);
    }
    .search-results__empty h3 {
      font-family: 'Bricolage Grotesque', sans-serif;
      font-size: 22px;
      color: var(--text);
      margin-bottom: 8px;
    }
    mark {
      background: var(--gold-faint);
      color: var(--gold-soft);
      padding: 1px 3px;
      border-radius: 3px;
      font-weight: 500;
    }

    /* ---------- FOOTER ---------- */
    .footer {
      margin-top: 64px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      color: var(--text-faint);
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    /* ---------- MOBILE ---------- */
    .menu-toggle { display: none; }

    @media (max-width: 900px) {
      .header { padding: 0 16px; gap: 12px; }
      .header__brand .brand__sub { display: none; }
      .header__stat { display: none; }
      .menu-toggle {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 36px; height: 36px;
        background: var(--bg-elev);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        font-size: 18px;
        flex-shrink: 0;
      }

      .app { grid-template-columns: 1fr; }
      .sidebar {
        position: fixed;
        left: 0; right: 0;
        top: var(--header-h);
        height: calc(100vh - var(--header-h));
        background: var(--bg);
        z-index: 40;
        transform: translateX(-100%);
        transition: transform 0.25s;
        width: 100%;
        max-width: 320px;
        border-right: 1px solid var(--border);
      }
      .sidebar.open { transform: translateX(0); }

      .main { padding: 28px 20px 60px; }
      .home-hero__title { font-size: 36px; }
      .article__title { font-size: 28px; }
      .home-grid { grid-template-columns: 1fr; }
      .area-header__title { font-size: 28px; }
    }

    /* ---------- ANIM ---------- */
    .fade-in {
      animation: fadeIn 0.25s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- ============== HEADER ============== -->
  <header class="header">
    <button class="menu-toggle" id="menuToggle" aria-label="Menu">☰</button>

    <a href="#/" class="header__brand" onclick="navigate('#/'); return false;">
      <span class="brand__mark"></span>
      <span>Playbook</span>
      <span class="brand__sub">Concierge</span>
    </a>

    <div class="header__search">
      <svg class="search__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input
        type="search"
        id="searchInput"
        placeholder="Buscar por dúvida, ferramenta, palavra-chave..."
        autocomplete="off"
      />
      <kbd class="search__shortcut">/</kbd>
    </div>

    <div class="header__stat">
      <span class="dot"></span>
      <span id="totalArticles">— artigos</span>
    </div>
  </header>

  <!-- ============== APP ============== -->
  <div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar__section">
        <div class="sidebar__label">Início</div>
        <a class="nav-item" href="#/" onclick="navigate('#/'); return false;">
          <span class="nav-item__icon">⌂</span>
          <span>Visão geral</span>
        </a>
      </div>
      <div class="sidebar__section">
        <div class="sidebar__label">Áreas</div>
        <div id="sidebarNav"></div>
      </div>
      <div class="sidebar__section">
        <div class="sidebar__label">Atalhos</div>
        <a class="nav-item" href="#/area/processos" onclick="navigate('#/area/processos'); return false;">
          <span class="nav-item__icon">🛡</span>
          <span>SLA & priorização</span>
        </a>
        <a class="nav-item" href="#/article/pc-scripts-mensagem" onclick="navigate('#/article/pc-scripts-mensagem'); return false;">
          <span class="nav-item__icon">💬</span>
          <span>Scripts prontos</span>
        </a>
      </div>
    </aside>

    <!-- MAIN -->
    <main class="main" id="main"></main>
  </div>

  <!-- DATA -->
  <script src="data.js"></script>

  <!-- APP LOGIC -->
  <script>
    const $ = (sel) => document.querySelector(sel);
    const DATA = window.PLAYBOOK_DATA;
    const main = $("#main");

    // ====== ESTADO INICIAL ======
    $("#totalArticles").textContent = `${DATA.articles.length} artigos`;

    // ====== SIDEBAR ======
    function renderSidebar() {
      const nav = $("#sidebarNav");
      nav.innerHTML = DATA.areas.map(a => {
        const count = DATA.articles.filter(art => art.area === a.id).length;
        return `
          <a class="nav-item" data-area="${a.id}" href="#/area/${a.id}"
             onclick="navigate('#/area/${a.id}'); return false;">
            <span class="nav-item__icon">${a.icon}</span>
            <span>${a.title}</span>
            <span class="nav-item__count">${count}</span>
          </a>`;
      }).join("");
    }

    function highlightSidebar(areaId) {
      document.querySelectorAll(".nav-item").forEach(el => {
        const a = el.dataset.area;
        const shouldBeActive = Boolean(a && areaId && a === areaId);
        el.classList.toggle("active", shouldBeActive);
      });
    }

    // ====== ROUTER ======
    function navigate(hash) {
      if (location.hash === hash) {
        renderRoute();
      } else {
        location.hash = hash;
      }
      $("#sidebar").classList.remove("open");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function renderRoute() {
      const hash = location.hash || "#/";
      main.innerHTML = "";

      if (hash === "#/" || hash === "") {
        renderHome();
      } else if (hash.startsWith("#/area/")) {
        const areaId = hash.replace("#/area/", "");
        renderArea(areaId);
      } else if (hash.startsWith("#/article/")) {
        const articleId = hash.replace("#/article/", "");
        renderArticle(articleId);
      } else if (hash.startsWith("#/search?q=")) {
        const q = decodeURIComponent(hash.replace("#/search?q=", ""));
        $("#searchInput").value = q;
        renderSearch(q);
      } else {
        renderHome();
      }
    }
    window.addEventListener("hashchange", renderRoute);

    // ====== HOME ======
    function renderHome() {
      highlightSidebar(null);
      const totalQ = DATA.articles.length;

      main.innerHTML = `
        <section class="home-hero fade-in">
          <div class="home-hero__eyebrow">Ecom Club · Time Concierge</div>
          <h1 class="home-hero__title">Tudo que o time precisa <em>numa busca só</em>.</h1>
          <p class="home-hero__lead">
            Base de conhecimento interna do time Concierge. Antes de digitar do zero, busque aqui — provavelmente a resposta já está documentada com prints, vídeos e passo a passo.
            Use <code>Ctrl/Cmd + K</code> ou <code>/</code> para abrir a busca.
          </p>
        </section>

        <div class="home-grid fade-in">
          ${DATA.areas.map(a => {
            const count = DATA.articles.filter(art => art.area === a.id).length;
            return `
              <div class="area-card" onclick="navigate('#/area/${a.id}')">
                <div class="area-card__header">
                  <div class="area-card__icon">${a.icon}</div>
                  <div class="area-card__title">${a.title}</div>
                </div>
                <div class="area-card__desc">${a.desc}</div>
                <div class="area-card__meta">
                  <span><strong>${count}</strong> artigos</span>
                  <span>Abrir →</span>
                </div>
              </div>`;
          }).join("")}
        </div>

        <footer class="footer">
          <span>Playbook Concierge · ${totalQ} artigos · uso interno</span>
          <span>Atualizações: toda quarta-feira</span>
        </footer>
      `;
    }

    // ====== ÁREA ======
    function renderArea(areaId) {
      const area = DATA.areas.find(a => a.id === areaId);
      if (!area) { renderHome(); return; }
      highlightSidebar(areaId);

      const articles = DATA.articles.filter(a => a.area === areaId);

      main.innerHTML = `
        <div class="area-header fade-in">
          <div class="breadcrumb">
            <a href="#/" onclick="navigate('#/'); return false;">Início</a>
            <span class="breadcrumb__sep">/</span>
            <span>${area.title}</span>
          </div>
          <h1 class="area-header__title">
            <span class="area-header__icon">${area.icon}</span>
            ${area.title}
          </h1>
          <p class="area-header__desc">${area.desc} · <strong style="color:var(--gold)">${articles.length} artigos</strong></p>
        </div>

        <div class="article-list fade-in">
          ${articles.map(art => `
            <a class="article-row" href="#/article/${art.id}"
               onclick="navigate('#/article/${art.id}'); return false;">
              <div class="article-row__title">${art.title}</div>
              <div class="article-row__summary">${art.summary}</div>
              <div class="article-row__tags">
                ${art.tags.slice(0,4).map(t => `<span class="tag">${t}</span>`).join("")}
              </div>
            </a>
          `).join("")}
        </div>
      `;
    }

    // ====== ARTIGO ======
    function renderArticle(articleId) {
      const art = DATA.articles.find(a => a.id === articleId);
      if (!art) { renderHome(); return; }
      const area = DATA.areas.find(a => a.id === art.area);
      highlightSidebar(art.area);

      main.innerHTML = `
        <article class="article fade-in">
          <div class="article__header">
            <div class="breadcrumb">
              <a href="#/" onclick="navigate('#/'); return false;">Início</a>
              <span class="breadcrumb__sep">/</span>
              <a href="#/area/${area.id}" onclick="navigate('#/area/${area.id}'); return false;">${area.title}</a>
            </div>
            <h1 class="article__title">${art.title}</h1>
            <p class="article__summary">${art.summary}</p>
            <div class="article__tags">
              ${art.tags.map(t => `<span class="tag">${t}</span>`).join("")}
            </div>
          </div>

          <div class="article__body">${art.body}</div>

          <div class="article__actions">
            <a href="#/area/${area.id}" onclick="navigate('#/area/${area.id}'); return false;"
               class="copy-link">← Voltar para ${area.title}</a>
            <button class="copy-link" id="copyLinkBtn" onclick="copyArticleLink('${art.id}')">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
              <span>Copiar link do artigo</span>
            </button>
          </div>
        </article>
      `;
    }

    function copyArticleLink(articleId) {
      const url = `${location.origin}${location.pathname}#/article/${articleId}`;
      navigator.clipboard.writeText(url).then(() => {
        const btn = $("#copyLinkBtn");
        btn.classList.add("copied");
        btn.querySelector("span").textContent = "Link copiado!";
        setTimeout(() => {
          btn.classList.remove("copied");
          btn.querySelector("span").textContent = "Copiar link do artigo";
        }, 2000);
      });
    }
    window.copyArticleLink = copyArticleLink;

    // ====== BUSCA ======
    function normalize(str) {
      return (str || "")
        .toString()
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");
    }

    function searchArticles(query) {
      const q = normalize(query.trim());
      if (!q) return [];
      const terms = q.split(/\s+/).filter(Boolean);

      return DATA.articles
        .map(art => {
          const haystack = normalize(
            art.title + " " + art.summary + " " + art.tags.join(" ") + " " + stripHtml(art.body)
          );
          // score: title hit conta mais
          const titleN = normalize(art.title);
          const summaryN = normalize(art.summary);
          const tagsN = normalize(art.tags.join(" "));

          let score = 0;
          for (const term of terms) {
            if (!haystack.includes(term)) return null;
            if (titleN.includes(term)) score += 10;
            if (summaryN.includes(term)) score += 5;
            if (tagsN.includes(term)) score += 4;
            score += (haystack.split(term).length - 1);
          }
          return { art, score };
        })
        .filter(Boolean)
        .sort((a, b) => b.score - a.score)
        .map(r => r.art);
    }

    function stripHtml(html) {
      const tmp = document.createElement("div");
      tmp.innerHTML = html;
      return tmp.textContent || "";
    }

    function highlight(text, query) {
      const terms = query.trim().split(/\s+/).filter(Boolean);
      if (!terms.length) return text;
      let html = text;
      terms.forEach(t => {
        const re = new RegExp(`(${escapeRegex(t)})`, "gi");
        html = html.replace(re, "<mark>$1</mark>");
      });
      return html;
    }
    function escapeRegex(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }

    function renderSearch(query) {
      highlightSidebar(null);
      const results = searchArticles(query);

      if (!query) {
        renderHome();
        return;
      }

      if (results.length === 0) {
        main.innerHTML = `
          <section class="search-results fade-in">
            <div class="search-results__header">
              <h1 class="search-results__title">Busca</h1>
              <p class="search-results__count">Nenhum artigo encontrado para <em>"${query}"</em></p>
            </div>
            <div class="search-results__empty">
              <h3>Não achei nada com essa palavra-chave.</h3>
              <p>Tente termos mais curtos ou diferentes. Se a dúvida ainda não está documentada, isso é melhoria para o Playbook — anote e leve à quarta-feira.</p>
            </div>
          </section>
        `;
        return;
      }

      main.innerHTML = `
        <section class="search-results fade-in">
          <div class="search-results__header">
            <h1 class="search-results__title">Busca</h1>
            <p class="search-results__count"><em>${results.length}</em> resultado${results.length>1?"s":""} para <em>"${query}"</em></p>
          </div>
          <div class="article-list">
            ${results.map(art => {
              const area = DATA.areas.find(a => a.id === art.area);
              return `
                <a class="article-row" href="#/article/${art.id}"
                   onclick="navigate('#/article/${art.id}'); return false;">
                  <div class="article-row__title">${highlight(art.title, query)}</div>
                  <div class="article-row__summary">${highlight(art.summary, query)}</div>
                  <div class="article-row__tags">
                    <span class="tag">${area.icon} ${area.title}</span>
                    ${art.tags.slice(0,3).map(t => `<span class="tag">${t}</span>`).join("")}
                  </div>
                </a>
              `;
            }).join("")}
          </div>
        </section>
      `;
    }

    // ====== SEARCH INPUT ======
    const searchInput = $("#searchInput");
    let searchDebounce;
    searchInput.addEventListener("input", (e) => {
      const q = e.target.value;
      clearTimeout(searchDebounce);
      searchDebounce = setTimeout(() => {
        if (q.trim()) {
          location.hash = `#/search?q=${encodeURIComponent(q)}`;
        } else if (location.hash.startsWith("#/search")) {
          location.hash = "#/";
        }
      }, 180);
    });

    // ESC limpa busca
    searchInput.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        searchInput.value = "";
        if (location.hash.startsWith("#/search")) location.hash = "#/";
        searchInput.blur();
      }
    });

    // Atalho global: / e Cmd/Ctrl+K
    document.addEventListener("keydown", (e) => {
      const isTyping = ["INPUT", "TEXTAREA"].includes(document.activeElement.tagName);
      if ((e.key === "/" && !isTyping) || ((e.ctrlKey || e.metaKey) && e.key === "k")) {
        e.preventDefault();
        searchInput.focus();
        searchInput.select();
      }
    });

    // Menu mobile
    $("#menuToggle").addEventListener("click", () => {
      $("#sidebar").classList.toggle("open");
    });

    // ============== INIT ==============
    renderSidebar();
    renderRoute();
  </script>
</body>
</html>
